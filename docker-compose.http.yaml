services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - 8443:8443
      - 9080:9080
      - 9443:9443
    networks:
      - dockerhost
    volumes:
      - /data/docker/volumes/nginx/conf/:/etc/nginx/conf.d
      - /data/docker/volumes/nginx/site:/usr/share/nginx/html
      - /data/docker/volumes/nginx/letsencrypt/etc:/etc/letsencrypt
      - /data/docker/volumes/nginx/certbot/www:/var/www/certbot
    environment:
      - TZ=Europe/Berlin
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: unless-stopped
    volumes:
      - /data/docker/volumes/nginx/letsencrypt/etc:/etc/letsencrypt
      - /data/docker/volumes/nginx/letsencrypt/log:/var/log/letsencrypt
      - /data/docker/volumes/nginx/certbot/www:/var/www/certbot
    environment:
      - TZ=Europe/Berlin
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - 80:80
      - 8080:8080
    networks:
      - web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  dockerhome:
    image: pkdevel/docker-home:latest
    container_name: dockerhome
    restart: unless-stopped
    networks:
      - web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.dockerhome.rule=Host(`docker.${DOMAIN}`)"
      - "traefik.http.routers.dockerhome.entrypoints=web"
      - "traefik.http.services.dockerhome.loadbalancer.server.port=8080"

networks:
  web:
    name: web
