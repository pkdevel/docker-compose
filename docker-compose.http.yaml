services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - 8443:8443
      - 9080:9080
      - 9443:9443
    networks:
      - dockerhost
    volumes:
      - /data/docker/volumes/nginx/conf/:/etc/nginx/conf.d
      - /data/docker/volumes/nginx/site:/usr/share/nginx/html
      - /data/docker/volumes/nginx/letsencrypt/etc:/etc/letsencrypt
      - /data/docker/volumes/nginx/certbot/www:/var/www/certbot
    environment:
      - TZ=Europe/Berlin
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: unless-stopped
    volumes:
      - /data/docker/volumes/nginx/letsencrypt/etc:/etc/letsencrypt
      - /data/docker/volumes/nginx/letsencrypt/log:/var/log/letsencrypt
      - /data/docker/volumes/nginx/certbot/www:/var/www/certbot
    environment:
      - TZ=Europe/Berlin
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    command:
      - "--global.checkNewVersion=false"
      - "--global.sendAnonymousUsage=false"

      - "--log.level=INFO"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      # - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--certificatesresolvers.letsencrypt.acme.email=${T_MAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
    ports:
      - 80:80
      - 443:443/tcp
      - 443:443/udp
    networks:
      - web
      - dockerhost
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/docker/volumes/traefik/letsencrypt:/letsencrypt
    environment:
      - CF_DNS_API_TOKEN=${CF_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik.middlewares=redirect-to-https"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

  dockerhome:
    image: pkdevel/docker-home:latest
    container_name: dockerhome
    restart: unless-stopped
    networks:
      - web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.dockerhome.rule=Host(`docker.${DOMAIN}`)"
      - "traefik.http.routers.dockerhome.middlewares=redirect-to-https"
      - "traefik.http.services.dockerhome.loadbalancer.server.port=8080"

networks:
  web:
    name: web
