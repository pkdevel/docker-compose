include:
  - docker-compose.arr.yaml
  - docker-compose.atuin.yaml
  - docker-compose.backup.yaml
  - docker-compose.git.yaml
  - docker-compose.http.yaml
  - docker-compose.iot.yaml
  - docker-compose.media.yaml
  - docker-compose.monitoring.yaml

services:
  cloudflare-ddns:
    image: oznu/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    restart: unless-stopped
    network_mode: host
    environment:
      API_KEY: ${CF_API_KEY}
      ZONE: ${CF_ZONE}
      SUBDOMAIN: ${CF_SUBDOMAIN}
      RRTYPE: AAAA
      INTERFACE: enp87s0

  dockerhost:
    image: qoomon/docker-host:latest
    container_name: dockerhost
    cap_add: ["NET_ADMIN", "NET_RAW"]
    restart: unless-stopped
    networks:
      - dockerhost
    environment:
      TZ: Europe/Berlin

  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      DIUN_WATCH_WORKERS: 20
      DIUN_WATCH_SCHEDULE: 0 * * * *
      DIUN_WATCH_JITTER: 30s
      DIUN_WATCH_RUNONSTARTUP: true
      DIUN_PROVIDERS_DOCKER: true
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: true
      DIUN_NOTIF_TELEGRAM_TOKEN: ${DIUN_NOTIF_TELEGRAM_TOKEN}
      DIUN_NOTIF_TELEGRAM_CHATIDS: ${DIUN_NOTIF_TELEGRAM_CHATIDS}
      DIUN_NOTIF_TELEGRAM_TEMPLATEBODY: 'Docker tag {{ if .Entry.Image.HubLink }}[{{ .Entry.Image }}]({{ .Entry.Image.HubLink }}){{ else }}{{ .Entry.Image }}{{ end }} which you subscribed to through {{ .Entry.Provider }} provider {{ if (eq .Entry.Status "new") }}is available{{ else }}has been updated{{ end }} on {{ .Entry.Image.Domain }} registry'
    volumes:
      - /data/docker/volumes/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: serve

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    ports:
      - 53:53/tcp
      - 53:53/udp
    networks:
      - web
    environment:
      TZ: Europe/Berlin
      FTLCONF_webserver_api_password: ${WEBPASSWORD}
    volumes:
      - /data/docker/volumes/pihole/cfg:/etc/pihole/
      - /data/docker/volumes/pihole/dnsmasq.d:/etc/dnsmasq.d/
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.pihole.rule=Host(`pihole.${DOMAIN}`)"
      - "traefik.http.routers.pihole.middlewares=redirect-to-https"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp
    networks:
      - dockerhost
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Berlin
      SERVERURL: ${CF_SUBDOMAIN}.${CF_ZONE}
      SERVERPORT: 51820
      PEERS: iphone,macbook
      PEERDNS: 192.168.178.31
      ALLOWEDIPS: 0.0.0.0/0
      PERSISTENTKEEPALIVE_PEERS: all
      LOG_CONFS: true
    volumes:
      - /data/docker/volumes/wireguard:/config
      - /lib/modules:/lib/modules
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      OLLAMA_BASE_URL: http://192.168.178.77:11434/
    volumes:
      - /data/docker/volumes/open-webui:/app/backend/data
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.ai.rule=Host(`ai.${DOMAIN}`)"
      - "traefik.http.routers.ai.middlewares=redirect-to-https"
      - "traefik.http.services.ai.loadbalancer.server.port=8080"

networks:
  dockerhost:
