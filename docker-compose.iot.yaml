services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:latest
    container_name: home-assistant
    restart: unless-stopped
    depends_on:
      - mqtt
      - influxdb
    network_mode: host
    volumes:
      - /data/docker/volumes/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    environment:
      TZ: Europe/Berlin
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dockerhost"
      - "traefik.http.routers.hass.rule=Host(`hass.${DOMAIN}`)"
      - "traefik.http.routers.hass.middlewares=redirect-to-https"
      - "traefik.http.services.hass.loadbalancer.server.url=http://dockerhost:8123"

  mqtt:
    image: eclipse-mosquitto:latest
    container_name: mqtt
    restart: unless-stopped
    networks:
      - mqtt
    ports:
      - 1883:1883
    volumes:
      - /data/docker/volumes/mqtt/cfg/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - /data/docker/volumes/mqtt/data:/mosquitto/data
    environment:
      TZ: Europe/Berlin

  mqttui:
    image: terdia07/mqttui:latest
    container_name: mqttui
    restart: unless-stopped
    networks:
      - mqtt
      - web
    environment:
      TZ: Europe/Berlin
      MQTT_BROKER: mqtt
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.mqttui.rule=Host(`mqtt.${DOMAIN}`)"
      - "traefik.http.routers.mqttui.middlewares=redirect-to-https"
      - "traefik.http.services.mqttui.loadbalancer.server.port=5000"

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    restart: unless-stopped
    networks:
      - web
    volumes:
      - /data/docker/volumes/node-red:/data
    environment:
      TZ: Europe/Berlin
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.nodered.rule=Host(`nodered.${DOMAIN}`)"
      - "traefik.http.routers.nodered.middlewares=redirect-to-https"
      - "traefik.http.services.nodered.loadbalancer.server.port=1880"

networks:
  mqtt:
