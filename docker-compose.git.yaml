services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    profiles:
      - gitea
    networks:
      - gitea
      - dockerhost
      - web
    volumes:
      - /data/docker/volumes/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.git.rule=Host(`git.${DOMAIN}`)"
      - "traefik.http.routers.git.middlewares=redirect-to-https"
      - "traefik.http.services.git.loadbalancer.server.port=3000"

  drone:
    image: drone/drone:latest
    container_name: drone
    restart: unless-stopped
    profiles:
      - gitea
    networks:
      - gitea
      - drone
      - web
    volumes:
      - /data/docker/volumes/drone:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DRONE_GITEA_SERVER=https://git.${DOMAIN}
      - DRONE_GITEA_CLIENT_ID=${DRONE_GITEA_CLIENT_ID}
      - DRONE_GITEA_CLIENT_SECRET=${DRONE_GITEA_CLIENT_SECRET}
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET}
      - DRONE_SERVER_HOST=drone.${DOMAIN}
      - DRONE_SERVER_PROTO=http
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.drone.rule=Host(`drone.${DOMAIN}`)"
      - "traefik.http.routers.drone.middlewares=redirect-to-https"
      - "traefik.http.services.drone.loadbalancer.server.port=80"

  drone-runner:
    image: drone/drone-runner-docker:latest
    container_name: drone-runner
    restart: unless-stopped
    profiles:
      - gitea
    depends_on:
      - drone
    networks:
      - drone
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DRONE_RPC_PROTO=https
      - DRONE_RPC_HOST=drone.${DOMAIN}
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET}
      - DRONE_RUNNER_CAPACITY=2
      - DRONE_RUNNER_NAME=drone-runner-1

  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: unless-stopped
    profiles:
      - gitlab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
    networks:
      - web
    volumes:
      - "/data/docker/volumes/gitlab/config:/etc/gitlab"
      - "/data/docker/volumes/gitlab/logs:/var/log/gitlab"
      - "/data/docker/volumes/gitlab/data:/var/opt/gitlab"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.gitlab.rule=Host(`gitlab.${DOMAIN}`)"
      - "traefik.http.routers.gitlab.middlewares=redirect-to-https"
      - "traefik.http.services.gitlab.loadbalancer.server.port=80"
    shm_size: "256m"

networks:
  gitea:
  gitea-db:
  drone:
